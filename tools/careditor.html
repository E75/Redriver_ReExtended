<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car editor</title>
<style>
	:root { --bg: #1b1d22; --panel: #23262d; --line: #363a44; --text: #d8dbe2; --dim: #8a90a0; --acc: #4da3ff; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, Segoe UI, sans-serif; }
	#app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
	#side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; }
	#view { position: relative; min-width: 0; }
	canvas { display: block; width: 100%; height: 100%; }
	h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
	button, select, input { font: inherit; color: var(--text); background: #2c3039; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
	button { cursor: pointer; }
	button:hover { border-color: var(--acc); }
	button.on { background: var(--acc); color: #000; border-color: var(--acc); }
	select { width: 100%; }
	.row { display: flex; gap: 6px; margin: 4px 0; flex-wrap: wrap; align-items: center; }
	.row > button { flex: 1; }
	.list button { width: 100%; text-align: left; margin: 1px 0; display: flex; gap: 6px; align-items: center; }
	.list button .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
	.list button.sel { border-color: var(--acc); background: #1d3552; }
	.xyz { display: grid; grid-template-columns: 18px 1fr; gap: 4px 6px; align-items: center; }
	.xyz input { width: 100%; }
	#info { color: var(--dim); font-size: 12px; min-height: 2.6em; }
	#hint { position: absolute; left: 10px; bottom: 8px; color: var(--dim); font-size: 12px; pointer-events: none; }
	label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
	input[type=checkbox] { padding: 0; }
</style>
<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
	<div id="side">
		<h3>Cars</h3>
		<div class="row">
			<button id="openDir" title="Chrome / Edge: pick the export folder, Save writes car.json back into it">Open folder</button>
			<button id="openFiles" title="Any browser: pick the export folder, Save downloads car.json">Open (read only)</button>
		</div>
		<input id="fileInput" type="file" webkitdirectory multiple hidden>
		<select id="carSel" size="1"></select>
		<div id="info">Open the folder written by <code>-carexport</code>.</div>

		<h3>View</h3>
		<div class="row"><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="rear">Rear</button><button data-view="top">Top</button></div>
		<div class="row">
			<label><input type="checkbox" id="optDouble"> double sided</label>
			<label><input type="checkbox" id="optWire"> wireframe</label>
			<label><input type="checkbox" id="optBody" checked> body</label>
			<label><input type="checkbox" id="optOrtho"> orthographic</label>
		</div>

		<h3>Points</h3>
		<div class="list" id="points"></div>

		<h3>Selected</h3>
		<div id="selName" style="margin-bottom:4px">-</div>
		<div class="xyz">
			<span>X</span><input type="number" id="fx" step="1">
			<span>Y</span><input type="number" id="fy" step="1">
			<span>Z</span><input type="number" id="fz" step="1">
		</div>
		<div class="row" id="radiusRow" hidden><span style="width:50px">Radius</span><input type="number" id="fr" step="1" style="flex:1"></div>
		<div class="row"><label><input type="checkbox" id="mirror" checked> mirror L/R</label></div>
		<div class="row"><button id="resetPt">Reset point</button></div>

		<h3>File</h3>
		<div class="row"><button id="save">Save car.json</button></div>
		<div id="saveInfo" style="color:var(--dim);font-size:12px"></div>
	</div>
	<div id="view"><div id="hint">Left drag: orbit &middot; right drag: pan &middot; wheel: zoom &middot; click a point, drag the arrows</div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Engine car frame (car.json): x sideways (+x = left of the car), y down, front is -z.
// The glb and this scene use the glTF frame: (x, -y, -z), y up, front is +z.
const toScene = (p) => new THREE.Vector3(p[0], -p[1], -p[2]);
const toEngine = (v) => [Math.round(v.x), Math.round(-v.y), Math.round(-v.z)];

const PAIRS = [
	['headlight', 'Headlight', 0xffe04a], ['brake', 'Brake light', 0xff3030], ['indicatorFront', 'Indicator front', 0xff9a1f],
	['indicatorBack', 'Indicator back', 0xff7a00], ['reverse', 'Reverse light', 0xf5f5f5],
];
const SINGLES = [['exhaust', 'Exhaust', 0x9aa0aa], ['police', 'Police / roof light', 0x3d7bff]];

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171b);
const persp = new THREE.PerspectiveCamera(35, 1, 5, 20000);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, -20000, 20000);
let camera = persp;
persp.position.set(900, 500, 900);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 50, 0);
const tc = new TransformControls(camera, renderer.domElement);
tc.setSize(0.8);
scene.add(tc);
tc.addEventListener('dragging-changed', (e) => { orbit.enabled = !e.value; });
tc.addEventListener('objectChange', onDrag);

const grid = new THREE.GridHelper(2000, 20, 0x444a56, 0x2c3038);
scene.add(grid);
const world = new THREE.Group();   // glb + markers
scene.add(world);

const store = new Map();           // id -> { id, json, orig, glb, dir, dirty }
let cur = null;                    // the loaded car in the scene
let bodyObj = null;
let markers = [];                  // { key, label, color, mesh, side, pairKey, wheel, idx }
let selected = null;

// ---------- loading ----------
const $ = (id) => document.getElementById(id);
const carSel = $('carSel');

$('openDir').onclick = async () => {
	if (!window.showDirectoryPicker) { $('info').textContent = 'No folder write access in this browser: use Open (read only).'; return; }
	try {
		const root = await showDirectoryPicker({ mode: 'readwrite' });
		store.clear();
		for await (const [name, h] of root.entries()) {
			if (h.kind !== 'directory') continue;
			try {
				const jf = await (await h.getFileHandle('car.json')).getFile();
				const gf = await (await h.getFileHandle('car.glb')).getFile();
				addCar(name, JSON.parse(await jf.text()), await gf.arrayBuffer(), h);
			} catch (e) { /* not a car folder */ }
		}
		fillList();
	} catch (e) { if (e.name !== 'AbortError') $('info').textContent = String(e); }
};
$('openFiles').onclick = () => $('fileInput').click();
$('fileInput').onchange = async (ev) => {
	const groups = new Map();
	for (const f of ev.target.files) {
		const parts = (f.webkitRelativePath || f.name).split('/');
		if (parts.length < 2) continue;
		const dir = parts[parts.length - 2];
		if (!groups.has(dir)) groups.set(dir, {});
		groups.get(dir)[parts[parts.length - 1]] = f;
	}
	store.clear();
	for (const [name, g] of groups) {
		if (!g['car.json'] || !g['car.glb']) continue;
		addCar(name, JSON.parse(await g['car.json'].text()), await g['car.glb'].arrayBuffer(), null);
	}
	fillList();
};

function addCar(id, json, glb, dir) {
	store.set(id, { id, json, orig: JSON.stringify(json), glb, dir, dirty: false });
}

function fillList() {
	carSel.innerHTML = '';
	for (const c of [...store.values()].sort((a, b) => a.id.localeCompare(b.id))) {
		const o = document.createElement('option');
		o.value = c.id;
		o.textContent = c.json.name + ' (' + c.id + ')';
		carSel.appendChild(o);
	}
	$('info').textContent = store.size + ' cars loaded.';
	if (store.size) loadCar(carSel.value);
}
carSel.onchange = () => loadCar(carSel.value);

const loader = new GLTFLoader();
function loadCar(id) {
	const c = store.get(id);
	if (!c) return;
	select(null);
	world.clear();
	markers = [];
	cur = c;
	loader.parse(c.glb.slice(0), '', (gltf) => {
		bodyObj = gltf.scene;
		bodyObj.traverse((o) => {
			if (!o.isMesh) return;
			const m = o.material;
			o.material = new THREE.MeshBasicMaterial({ map: m.map, vertexColors: true, alphaTest: 0.5, transparent: false });
			if (o.material.map) { o.material.map.colorSpace = THREE.SRGBColorSpace; o.material.map.magFilter = THREE.NearestFilter; o.material.map.minFilter = THREE.NearestFilter; }
		});
		world.add(bodyObj);
		applyOpts();
		buildMarkers();
		frame();
		$('info').textContent = c.json.name + ' - ' + c.json.source.city + ' model ' + c.json.source.model;
	}, (e) => { $('info').textContent = 'glb error: ' + e; });
}

// ---------- markers ----------
function makeMesh(color, wheel) {
	let g;
	if (wheel) {
		g = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 34, 24), new THREE.MeshBasicMaterial({ color, wireframe: true, depthTest: false }));
		g.rotation.z = Math.PI / 2;
		const holder = new THREE.Group();
		holder.add(g);
		holder.userData.cyl = g;
		return holder;
	}
	return new THREE.Mesh(new THREE.SphereGeometry(7, 14, 10), new THREE.MeshBasicMaterial({ color, depthTest: false }));
}

function addMarker(m) {
	m.mesh = makeMesh(m.color, !!m.wheel);
	m.mesh.renderOrder = 10;
	m.mesh.userData.marker = m;
	world.add(m.mesh);
	markers.push(m);
}

function cogX() { return cur.json.cog[0]; }

function buildMarkers() {
	const j = cur.json;
	for (let w = 0; w < 4; w++) {
		const wh = j.wheels[w];
		addMarker({ key: 'wheel' + w, label: 'Wheel ' + (w & 1 ? 'rear' : 'front') + (wh.pos[0] > cogX() ? ' L' : ' R'), color: 0x4de07a, wheel: true, get: () => wh.pos, idx: w, axle: w & 1 });
	}
	for (const [k, label, color] of PAIRS) {
		for (const s of ['L', 'R']) addMarker({ key: k + s, label: label + ' ' + s, color, get: () => j.lamps[k][s], pair: k, side: s });
	}
	for (const [k, label, color] of SINGLES) addMarker({ key: k, label, color, get: () => j.lamps[k] });
	addMarker({ key: 'cog', label: 'Centre of gravity (fixed)', color: 0xff4de1, get: () => j.cog, fixed: true });
	refreshMarkers();
	buildList();
}

function refreshMarkers() {
	for (const m of markers) {
		m.mesh.position.copy(toScene(m.get()));
		if (m.wheel) {
			const r = cur.json.wheelRadius;
			m.mesh.userData.cyl.scale.set(r, 1, r);
		}
	}
}

function buildList() {
	const l = $('points');
	l.innerHTML = '';
	for (const m of markers) {
		const b = document.createElement('button');
		b.innerHTML = '<span class="dot" style="background:#' + m.color.toString(16).padStart(6, '0') + '"></span>' + m.label;
		b.onclick = () => select(m);
		m.btn = b;
		l.appendChild(b);
	}
}

// ---------- selection / editing ----------
function select(m) {
	selected = m;
	for (const x of markers) x.btn && x.btn.classList.toggle('sel', x === m);
	if (m && !m.fixed) tc.attach(m.mesh); else tc.detach();
	$('selName').textContent = m ? m.label : '-';
	$('radiusRow').hidden = !(m && m.wheel);
	syncFields();
}

function syncFields() {
	const p = selected ? selected.get() : [0, 0, 0];
	$('fx').value = p[0]; $('fy').value = p[1]; $('fz').value = p[2];
	if (selected && selected.wheel) $('fr').value = cur.json.wheelRadius;
	for (const id of ['fx', 'fy', 'fz']) $(id).disabled = !selected || selected.fixed;
}

function setPoint(m, p) {
	const dst = m.get();
	dst[0] = p[0]; dst[1] = p[1]; dst[2] = p[2];
	if ($('mirror').checked) {
		const o = mirrorOf(m);
		if (o) { const q = o.get(); q[0] = 2 * cogX() - p[0]; q[1] = p[1]; q[2] = p[2]; }
	}
	cur.dirty = true;
	refreshMarkers();
	syncFields();
	$('saveInfo').textContent = 'modified, not saved';
}

function mirrorOf(m) {
	if (m.pair) return markers.find((x) => x.pair === m.pair && x.side !== m.side);
	if (m.wheel) return markers.find((x) => x.wheel && x.axle === m.axle && x !== m);
	return null;
}

function onDrag() {
	if (!selected) return;
	setPoint(selected, toEngine(selected.mesh.position));
}

for (const id of ['fx', 'fy', 'fz']) {
	$(id).oninput = () => { if (selected && !selected.fixed) setPoint(selected, [+$('fx').value, +$('fy').value, +$('fz').value]); };
}
$('fr').oninput = () => { cur.json.wheelRadius = +$('fr').value || 1; cur.dirty = true; refreshMarkers(); };
$('resetPt').onclick = () => {
	if (!selected || selected.fixed) return;
	const orig = JSON.parse(cur.orig);
	const get = (j) => selected.wheel ? j.wheels[selected.idx].pos : selected.pair ? j.lamps[selected.pair][selected.side] : j.lamps[selected.key];
	const p = get(orig);
	setPoint(selected, [p[0], p[1], p[2]]);
};

// click to pick
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', (e) => {
	if (tc.dragging || e.button !== 0) return;
	const r = renderer.domElement.getBoundingClientRect();
	const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
	ray.setFromCamera(v, camera);
	let best = null, bd = 1e9;
	for (const m of markers) {
		const p = m.mesh.getWorldPosition(new THREE.Vector3());
		const d = ray.ray.distanceToPoint(p);
		const rad = m.wheel ? cur.json.wheelRadius * 0.35 : 12;
		if (d < rad && d < bd) { bd = d; best = m; }
	}
	if (best) select(best);
});

// ---------- save ----------
function updateRaw(j) {
	// the values the game holds (CAR_COSMETICS): lamp = value + cog, mirrored over x = cog.x; wheel = (hub - x, 14 - compression - radius - y, -z)
	const cog = j.cog;
	const rel = (p) => [p[0] - cog[0], p[1] - cog[1], p[2] - cog[2]];
	const old = j.raw;
	const raw = { headLight: rel(j.lamps.headlight.L), frontInd: rel(j.lamps.indicatorFront.L), backInd: rel(j.lamps.indicatorBack.L),
		brakeLight: rel(j.lamps.brake.L), revLight: rel(j.lamps.reverse.L), policeLight: [old.policeLight[0], j.lamps.police[1] - cog[1], j.lamps.police[2] - cog[2]],
		exhaust: rel(j.lamps.exhaust), smoke: old.smoke, fire: old.fire, cog: cog.slice(), wheelSize: j.wheelRadius,
		wheelDisp: j.wheels.map((w) => [w.hubX - w.pos[0], 14 - w.compression - j.wheelRadius - w.pos[1], -w.pos[2]]) };
	j.raw = raw;
}

function fmt(j) {
	// one lamp / wheel per line, like the exporter
	const v = (a) => '[' + a.join(', ') + ']';
	const pr = (k) => '    "' + k + '": { "L": ' + v(j.lamps[k].L) + ', "R": ' + v(j.lamps[k].R) + ' }';
	let s = '{\n  "schema": ' + JSON.stringify(j.schema) + ',\n  "id": ' + JSON.stringify(j.id) + ',\n  "name": ' + JSON.stringify(j.name) + ',\n';
	s += '  "source": ' + JSON.stringify(j.source) + ',\n  "units": ' + JSON.stringify(j.units) + ',\n  "frame": ' + JSON.stringify(j.frame) + ',\n';
	s += '  "mesh": ' + JSON.stringify(j.mesh) + ',\n  "cog": ' + v(j.cog) + ',\n  "wheelRadius": ' + j.wheelRadius + ',\n  "wheels": [\n';
	s += j.wheels.map((w) => '    { "axle": "' + w.axle + '", "hubX": ' + w.hubX + ', "compression": ' + w.compression + ', "pos": ' + v(w.pos) + ' }').join(',\n') + '\n  ],\n  "lamps": {\n';
	s += ['headlight', 'brake', 'indicatorFront', 'indicatorBack', 'reverse'].map(pr).join(',\n') + ',\n';
	s += '    "exhaust": ' + v(j.lamps.exhaust) + ',\n    "police": ' + v(j.lamps.police) + '\n  },\n  "raw": {\n';
	const r = j.raw;
	s += ['headLight', 'frontInd', 'backInd', 'brakeLight', 'revLight', 'policeLight', 'exhaust', 'smoke', 'fire', 'cog'].map((k) => '    "' + k + '": ' + v(r[k])).join(',\n') + ',\n';
	s += '    "wheelSize": ' + r.wheelSize + ',\n    "wheelDisp": [' + r.wheelDisp.map(v).join(', ') + ']\n  }\n}\n';
	return s;
}

$('save').onclick = async () => {
	if (!cur) return;
	updateRaw(cur.json);
	const text = fmt(cur.json);
	try {
		if (cur.dir) {
			const w = await (await cur.dir.getFileHandle('car.json')).createWritable();
			await w.write(text);
			await w.close();
			$('saveInfo').textContent = 'saved ' + cur.id + '/car.json';
		} else {
			const a = document.createElement('a');
			a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
			a.download = 'car.json';
			a.click();
			$('saveInfo').textContent = 'downloaded car.json (put it in ' + cur.id + '/)';
		}
		cur.orig = JSON.stringify(cur.json);
		cur.dirty = false;
	} catch (e) { $('saveInfo').textContent = 'save failed: ' + e; }
};

// ---------- views ----------
function applyOpts() {
	bodyObj.visible = $('optBody').checked;
	bodyObj.traverse((o) => {
		if (!o.isMesh) return;
		o.material.side = $('optDouble').checked ? THREE.DoubleSide : THREE.FrontSide;
		o.material.wireframe = $('optWire').checked;
	});
}
for (const id of ['optDouble', 'optWire', 'optBody']) $(id).onchange = () => bodyObj && applyOpts();

function useCamera(c) {
	c.position.copy(camera.position);
	c.quaternion.copy(camera.quaternion);
	camera = c;
	orbit.object = c;
	tc.camera = c;
	resize();
}
$('optOrtho').onchange = () => { useCamera($('optOrtho').checked ? ortho : persp); orbit.update(); };

function setView(name) {
	const d = 1400, t = orbit.target;
	const dirs = { front: [0, 0, 1], rear: [0, 0, -1], side: [1, 0, 0], top: [0, 1, 0.0001] };
	const v = dirs[name];
	camera.position.set(t.x + v[0] * d, t.y + v[1] * d, t.z + v[2] * d);
	camera.up.set(0, 1, 0);
	orbit.update();
}
document.querySelectorAll('[data-view]').forEach((b) => { b.onclick = () => setView(b.dataset.view); });

function frame() {
	if (!bodyObj) return;
	const box = new THREE.Box3().setFromObject(bodyObj);
	const c = box.getCenter(new THREE.Vector3());
	orbit.target.copy(c);
	grid.position.y = box.min.y - (cur.json.wheelRadius > 0 ? 0 : 0);
	// the ground is the wheel bottom
	const w = cur.json.wheels[0];
	grid.position.y = -w.pos[1] - cur.json.wheelRadius;
	setView('front');
	camera.position.add(new THREE.Vector3(500, 300, 0));
	orbit.update();
}

function resize() {
	const w = view.clientWidth, h = view.clientHeight;
	renderer.setSize(w, h, false);
	persp.aspect = w / h;
	persp.updateProjectionMatrix();
	const s = 500;
	ortho.left = -s * w / h; ortho.right = s * w / h; ortho.top = s; ortho.bottom = -s;
	ortho.zoom = 1;
	ortho.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

(function loop() {
	requestAnimationFrame(loop);
	orbit.update();
	renderer.render(scene, camera);
})();

window.careditor = { store, get cur() { return cur; }, select, markers: () => markers, setView, addCar, fillList };
</script>
</body>
</html>
